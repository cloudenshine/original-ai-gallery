<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回到平衡 · 交互解释</title><link rel="stylesheet" href="../case.css"><main><a href="../../">← 返回案例馆</a><div class="eyebrow">INTERACTIVE EXPLAINER / 004</div><h1>回到平衡，需要几次摆动？</h1><p>调节阻尼，比较直接到达和来回振荡。这是归一化数学响应，不是实测数据。</p><section aria-label="可播放演示"><h2>先观看，再调节</h2><video controls playsinline preload="metadata" poster="demo-poster.png" style="display:block;width:100%;height:auto"><source src="demo.mp4" type="video/mp4">浏览器不支持视频，请下载观看。</video><p>24 秒 · 依次比较 ζ=0.15、0.55、1.00、1.20 · 归一化数学演示，非实测。含原创合成配乐与提示音。</p><p><a href="demo.mp4" download>下载演示 MP4</a> · <a href="demo-source.zip" download>下载演示源码与无损分轨</a></p></section><div class="stage"><svg viewBox="0 0 1000 600" role="img" aria-label="随阻尼变化的归一化响应"><rect width="1000" height="600" fill="#eee9dc"/><path d="M90 90V470H910M90 220H910" fill="none" stroke="#c0c6b6" stroke-dasharray="4 6"/><g fill="#496452" font-family="sans-serif" font-size="13"><text x="90" y="55">NORMALIZED RESPONSE</text><text x="58" y="475">0</text><text x="58" y="225">1</text><text x="90" y="505">0</text><text x="900" y="505">6s</text><text x="90" y="560">ωₙ = 5 rad/s · 数学示意</text></g><path id="curve" fill="none" stroke="#204a41" stroke-width="4"/><circle id="dot" r="10" fill="#df6e3c" stroke="#fff6e3" stroke-width="3"/></svg></div><div class="controls"><label>阻尼比 ζ <input id="damping" type="range" min=".15" max="1.2" value=".55" step=".01"> <output id="value">0.55</output></label><button id="play">播放响应</button><button id="reset">恢复默认</button></div><p id="description" aria-live="polite"></p><footer>JavaScript + SVG · 原创交互解释 · 非产品性能或实测数据</footer></main><script type="module">import{springPosition,springCurve}from'./model.mjs';const s=document.querySelector('#damping'),c=document.querySelector('#curve'),d=document.querySelector('#dot'),b=document.querySelector('#play');let f;const x=t=>90+t/6*820,y=p=>470-p*250;function pos(t){d.setAttribute('cx',x(t));d.setAttribute('cy',y(springPosition(t,+s.value)))}function draw(){cancelAnimationFrame(f);b.textContent='播放响应';document.querySelector('#value').textContent=(+s.value).toFixed(2);c.setAttribute('d',springCurve(+s.value).map(([t,p],i)=>(i?'L':'M')+x(t)+','+y(p)).join(' '));pos(6);document.querySelector('#description').textContent=+s.value<1?'欠阻尼：越过目标，再逐渐回到平衡。阻尼越小，振荡越明显。':+s.value===1?'临界阻尼：不振荡地趋近目标。':'过阻尼：不越过目标，但回到平衡更缓慢。'}s.oninput=draw;b.onclick=()=>{cancelAnimationFrame(f);let start=performance.now();b.textContent='重新播放';function tick(n){let t=(n-start)/1000;pos(Math.min(6,t));if(t<6)f=requestAnimationFrame(tick);else b.textContent='播放响应'}f=requestAnimationFrame(tick)};document.querySelector('#reset').onclick=()=>{s.value=.55;draw()};draw();</script></html>
