<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原创动态作品</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#f6f3eb;color:#242e2e;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif}a{color:inherit;text-underline-offset:4px}main{max-width:1280px;margin:auto;padding:30px 40px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;border-bottom:1px solid #d8d8cf;padding-bottom:20px}.label{font-size:11px;letter-spacing:.16em}section.intro{display:grid;grid-template-columns:1fr 1.2fr;gap:35px;align-items:end;padding:32px 0 26px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#6d7875}h1{font-family:Georgia,'Noto Serif CJK SC',serif;font-size:clamp(26px,4vw,45px);font-weight:500;margin:10px 0 0;line-height:1.2}#description{font-size:14px;line-height:1.8;max-width:620px;color:#5c6864;margin:0}.stage{background:#e6e8de;border:1px solid #d5d8cf;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:3/2}.controls{display:grid;grid-template-columns:auto minmax(160px,1fr) minmax(180px,.8fr);align-items:end;gap:30px;padding:22px;background:#fffdf8;border-top:1px solid #d5d8cf}.buttons{display:flex;gap:8px}button{background:#f5f3ea;border:1px solid #b8c1b8;border-radius:5px;padding:11px 16px;font:inherit;font-size:13px;cursor:pointer;color:#263d35}button:first-child{background:#203f35;color:#fff;border-color:#203f35}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #cc7048;outline-offset:4px}label{font-size:12px;display:flex;justify-content:space-between;gap:15px;margin-bottom:10px;color:#465b52}input[type=range]{width:100%;display:block;accent-color:var(--accent,#426b57);height:20px;margin:0;cursor:pointer}.footnote{display:flex;justify-content:space-between;gap:20px;margin-top:16px;font-size:11px;color:#728078;line-height:1.6}.links{display:flex;gap:17px;flex-wrap:wrap}footer{margin-top:32px;display:flex;justify-content:space-between;gap:24px;font-size:11px;color:#6e7972}.badge{border:1px solid #bec7bd;border-radius:30px;padding:5px 10px;font-size:10px;letter-spacing:.08em} @media(max-width:700px){main{padding:18px 16px 30px}section.intro{grid-template-columns:1fr;gap:16px;padding:24px 0}h1{font-size:32px}.controls{grid-template-columns:1fr;gap:18px;padding:18px}.buttons button{flex:1}.footnote,footer{flex-direction:column;gap:8px}.label{letter-spacing:.03em}header{font-size:12px}.badge{font-size:9px}}
</style></head><body><main><header><a href="../../offline-batch.html">← 造物案例馆</a><span class="label">ORIGINAL CODE WORKS</span><span class="badge">程序绘制 · 非图像模型</span></header><section class="intro"><div><span id="subtitle" class="eyebrow"></span><h1 id="title"></h1></div><p id="description"></p></section><div class="stage"><canvas id="scene" width="1200" height="800" role="img"></canvas><div class="controls"><div class="buttons"><button type="button" id="play" aria-pressed="true">暂停</button><button type="button" id="reset">重置</button></div><div><label for="seek"><span>播放位置</span><output id="time"></output></label><input id="seek" type="range" min="0" max="20" step="0.01" value="0"></div><div><label for="parameter"><span id="parameter-label"></span><output id="parameter-value"></output></label><input id="parameter" type="range"></div></div></div><div class="footnote"><span id="motion-note"></span><span id="duration"></span></div><footer><span>原创浏览器动效 · 附静音技术预览 · 非完整声画影片</span><span class="links"><a href="scene.mjs">场景源码</a><a href="provenance.json">来源与验证</a><a href="brief.md">制作说明</a></span></footer></main><script type="module">function clockState(duration,reducedMotion=false){return {t:0,duration,playing:!reducedMotion}}
function advance(s,delta){if(!s.playing||!Number.isFinite(delta)||delta<0)return {...s};return {...s,t:(s.t+delta)%s.duration}}
function seek(s,t){return {...s,t:Math.max(0,Math.min(s.duration,Number.isFinite(t)?t:0)),playing:false}}
function reset(s){return {...s,t:0}}
function parameterValue(v,p){return Number.isFinite(v)?Math.max(p.min,Math.min(p.max,v)):p.value}

const config={id:'signal-letterpress',title:'信号成字',subtitle:'Make room for wonder',description:'散落的字母沿各自轨迹归位，停留成一张有呼吸的活版海报。',category:'coding-motion',useCase:'动态字体 · 片头设计 · 品牌宣言',accent:'#e75932',duration:10,parameter:{label:'初始散开幅度',min:0,max:100,step:1,value:65,unit:'%'}};
const words=['MAKE','ROOM','FOR','WONDER'];
function letterState(t,value){let n=0;const time=((t%10)+10)%10;return words.flatMap((word,row)=>[...word].map((char,col)=>{const i=n++,local=Math.max(0,Math.min(1,(time-.045*i)/2.7)),returnPhase=Math.max(0,Math.min(1,(time-8)/2)),p=(1-Math.pow(1-local,4))*(1-returnPhase*returnPhase*(3-2*returnPhase)),spread=Math.max(0,Math.min(100,value))/100;const x=105+col*(row===3?150:177),y=257+row*132;return{char,row,x:x+(1-p)*Math.sin(i*2.4+1)*230*spread,y:y+(1-p)*Math.cos(i*1.7)*170*spread,rotation:(1-p)*Math.sin(i*3)*.7*spread};}));}
function render(c,{t,value,width,height}){c.save();c.scale(width/1200,height/800);c.fillStyle='#ede9dd';c.fillRect(0,0,1200,800);c.fillStyle='#171f2a';c.fillRect(40,39,1120,3);c.font='13px monospace';c.fillText('SIGNAL PRESS',55,74);c.fillText('TYPE EXPERIMENT / 003',890,74);c.fillStyle='#e45b35';c.fillRect(887,105,245,435);
// Registration and composition marks belong to the print, not the player.
c.strokeStyle='#17202b40';c.lineWidth=1;for(const [x,y]of [[52,110],[1147,110],[52,702],[1147,702]]){c.beginPath();c.moveTo(x-9,y);c.lineTo(x+9,y);c.moveTo(x,y-9);c.lineTo(x,y+9);c.stroke();}for(let y=265;y<690;y+=132){c.strokeStyle='#28344722';c.beginPath();c.moveTo(77,y);c.lineTo(1124,y);c.stroke();}
for(const l of letterState(t,value)){c.save();c.translate(l.x,l.y);c.rotate(l.rotation);c.font=`900 ${l.row===3?151:164}px sans-serif`;c.fillStyle='#e45b35';c.fillText(l.char,3,2);c.fillStyle='#15222a';c.fillText(l.char,0,0);c.restore();}
// A narrow editorial column makes the deliberately empty space meaningful.
c.save();c.translate(1080,148);c.rotate(Math.PI/2);c.fillStyle='#efeadd';c.font='14px monospace';c.fillText('LEAVE A LITTLE SPACE',0,0);c.fillText('FOR THE UNEXPECTED.',0,24);c.restore();c.fillStyle='#18252d';c.font='14px "Noto Sans CJK SC", sans-serif';c.fillText('给奇想，留一席之地。',79,743);c.font='11px monospace';c.fillText('ORIGINAL WORDS / CODE-DRIVEN TYPE',785,744);c.strokeStyle='#17202b';c.beginPath();c.moveTo(79,710);c.lineTo(1126,710);c.stroke();
// Tiny printer's color marks.
['#17252d','#e45b35','#cfb78c'].forEach((v,i)=>{c.fillStyle=v;c.fillRect(1093+i*13,775,9,9);});c.restore();}

const $=s=>document.querySelector(s),canvas=$('#scene'),ctx=canvas.getContext('2d'),media=matchMedia('(prefers-reduced-motion: reduce)');let state=clockState(config.duration,media.matches),value=config.parameter.value,previous=performance.now();
if(media.matches)state.t=Math.min(5,config.duration);
document.title=config.title+' · 造物案例馆';$('#title').textContent=config.title;$('#subtitle').textContent=config.subtitle;$('#description').textContent=config.description;document.documentElement.style.setProperty('--accent',config.accent);canvas.setAttribute('aria-label',config.title+'的程序绘制画面。'+config.description);$('#parameter-label').textContent=config.parameter.label;let input=$('#parameter');Object.assign(input,{min:config.parameter.min,max:config.parameter.max,step:config.parameter.step,value});$('#seek').max=config.duration;$('#duration').textContent=config.duration+' 秒循环';
function labels(){ $('#play').textContent=state.playing?'暂停':'播放';$('#play').setAttribute('aria-pressed',String(state.playing));$('#seek').value=state.t;$('#time').textContent=state.t.toFixed(1)+' 秒';$('#parameter-value').textContent=value+(config.parameter.unit||'');$('#motion-note').textContent=media.matches?'已按系统设置减少动态，可手动播放。':'可暂停、逐帧拖动，或调整一个参数。';}
function draw(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);render(ctx,{t:state.t,value,width:canvas.width,height:canvas.height});ctx.restore();canvas.dataset.time=state.t.toFixed(4);canvas.dataset.value=value;canvas.dataset.playing=state.playing;labels()}
$('#play').onclick=()=>{state.playing=!state.playing;previous=performance.now();draw()};$('#reset').onclick=()=>{state=reset(state);value=config.parameter.value;input.value=value;previous=performance.now();draw()};$('#seek').oninput=e=>{state=seek(state,+e.target.value);draw()};input.oninput=e=>{value=parameterValue(+e.target.value,config.parameter);draw()};media.addEventListener('change',e=>{if(e.matches)state.playing=false;draw()});document.addEventListener('visibilitychange',()=>{previous=performance.now()});function frame(now){let delta=(now-previous)/1000;previous=now;if(state.playing&&!document.hidden){state=advance(state,Math.min(delta,.1));draw()}requestAnimationFrame(frame)}draw();requestAnimationFrame(frame);</script></body></html>
