<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无名地形 · 代码图像</title><link rel="stylesheet" href="../case.css"><main><a href="../../">← 返回案例馆</a><div class="eyebrow">PROCEDURAL IMAGE / 002</div><h1>无名地形</h1><p>31 条闭合曲线，描出一座不存在的岛。改变种子，看看相同规则如何生长出不同轮廓。</p><div id="art" class="stage"></div><div class="controls"><button id="next">换一座岛</button><button id="save">保存 SVG</button><span>种子 <output id="seed">00</output></span></div><p>数学规则生成的图形，不是图像模型输出，也不是实际地理数据。</p><footer>SVG + JavaScript · 本次原创源码与构图 · 无外部素材</footer></main><script type="module">import{contourSVG}from'./geometry.mjs';let seed=0;const art=document.querySelector('#art');function draw(){art.innerHTML=contourSVG(seed);document.querySelector('#seed').textContent=String(seed).padStart(2,'0')}draw();document.querySelector('#next').onclick=()=>{seed=(seed+1)%100;draw()};document.querySelector('#save').onclick=()=>{const u=URL.createObjectURL(new Blob([contourSVG(seed)],{type:'image/svg+xml'})),a=document.createElement('a');a.href=u;a.download=`contour-${seed}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
